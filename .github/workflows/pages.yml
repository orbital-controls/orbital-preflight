name: Deploy to GitHub Pages

# A fork goes live once Pages is enabled with "GitHub Actions" as the source
# (Settings → Pages). To build with a config other than orbital-preflight.config.ts,
# set the repository variable ORBITAL_PREFLIGHT_CONFIG to its path: Phil's instance
# uses instances/orbitalcontrols/orbital-preflight.config.ts.
#
# Analytics are off unless these repository variables are set (README, "Analytics"):
# GA_MEASUREMENT_ID, UMAMI_WEBSITE_ID and UMAMI_HOST. Variables, not secrets: the IDs
# are public in every page's HTML.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v6.0.0
      - run: pnpm install --frozen-lockfile
      # `/<repo>` for a project site, empty for a user site or a custom domain.
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ORBITAL_PREFLIGHT_CONFIG: ${{ vars.ORBITAL_PREFLIGHT_CONFIG || 'orbital-preflight.config.ts' }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          UMAMI_HOST: ${{ vars.UMAMI_HOST }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
