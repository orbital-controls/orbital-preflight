name: Deploy to GitHub Pages

# A fork goes live once Pages is enabled with "GitHub Actions" as the source
# (Settings → Pages). Phil's instance deploys to Cloudflare instead and sets the
# repository variable CLOUDFLARE_DEPLOY to "true", which skips this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.CLOUDFLARE_DEPLOY != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install the theme package from npm
        run: |
          if grep -q '"@orbital-controls/theme": "link:' package.json; then
            pnpm pkg set 'dependencies.@orbital-controls/theme=^0.1.0'
            echo "INSTALL_FLAGS=--no-frozen-lockfile" >> "$GITHUB_ENV"
          fi
      - run: pnpm install ${INSTALL_FLAGS:---frozen-lockfile}
      # `/<repo>` for a project site, empty for a user site or a custom domain.
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
