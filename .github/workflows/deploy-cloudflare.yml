name: Deploy Phil's instance to Cloudflare

# Only runs where the repository variable CLOUDFLARE_DEPLOY is "true" (Phil's repo).
# Needs the secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install the theme package from npm
        run: |
          if grep -q '"@orbital-controls/theme": "link:' package.json; then
            pnpm pkg set 'dependencies.@orbital-controls/theme=^0.1.0'
            echo "INSTALL_FLAGS=--no-frozen-lockfile" >> "$GITHUB_ENV"
          fi
      - run: pnpm install ${INSTALL_FLAGS:---frozen-lockfile}
      - run: pnpm build
        env:
          ORBITAL_PREFLIGHT_CONFIG: instances/orbitalcontrols/orbital-preflight.config.ts
      - run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
